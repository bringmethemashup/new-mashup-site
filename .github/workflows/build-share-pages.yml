# Regenerates s/<id>.html — one Open Graph share page per approved mashup.
# Runs nightly and on demand; also whenever the generator or catalog changes.
name: Build share pages

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/build-share-pages.mjs'
      - 'data/catalog.json'

permissions:
  contents: write

concurrency:
  group: build-share-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate share pages
        run: node scripts/build-share-pages.mjs
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A s
          if git diff --cached --quiet; then
            echo "no share-page changes"
          else
            git commit -m "Rebuild share pages"
            git push
          fi
